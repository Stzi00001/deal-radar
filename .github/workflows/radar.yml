name: Deal-Radar

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub kann sich ein paar Minuten verspäten)
  workflow_dispatch: {}      # manueller Start über den "Run workflow"-Knopf
  push:
    paths:
      - config.json
      - data/feedback.json

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deals holen und filtern
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python radar.py
      - name: Ergebnis speichern
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deals.json
          git diff --cached --quiet && exit 0
          git commit -m "Deals aktualisiert [skip ci]"
          git pull --rebase --autostash || true
          git push
