name: Deal-Radar

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub kann sich ein paar Minuten verspäten)
  workflow_dispatch:         # manueller Start (App-Knopf, cron-job.org, "Run workflow")
    inputs:
      test_push:
        description: "Nur einen Test-Push senden"
        type: boolean
        default: false
  push:
    paths:
      - config.json
      - data/feedback.json

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deals holen und filtern
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: python radar.py
      - name: Ergebnis speichern
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git add data/deals.json
            git diff --cached --quiet && exit 0
            git commit -qm "Deals aktualisiert [skip ci]"
            git push -q && exit 0
            echo "Ein anderer Lauf war schneller – neu aufsetzen (Versuch $i)"
            git fetch -q origin main && git reset -q --hard origin/main
            NTFY_TOPIC="" python radar.py   # Pushes wurden schon gesendet
          done
          exit 1
